name: Keep backend & Supabase warm

on:
  schedule:
    # Every 3 days, well inside Render's 15-min idle sleep and Supabase's
    # 7-day free-tier pause window.
    - cron: "0 8 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /departments (hits Supabase through the backend)
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "${{ vars.BACKEND_URL }}/departments" -o /dev/null
