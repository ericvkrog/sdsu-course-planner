<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#A6192E" />
    <meta name="color-scheme" content="light only" />
    <title>SDSU Course Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Paint the SDSU red immediately, before the stylesheet loads or React
         mounts, so the header doesn't pop in over a blank/pale background. */
      html {
        background-color: #a6192e;
        /* Opt out of forced dark/theme rewriting (browser auto-dark-mode and
           extensions like BetterCampus) that were recoloring body text to
           match its background, making the page look blank white. */
        color-scheme: light only !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
